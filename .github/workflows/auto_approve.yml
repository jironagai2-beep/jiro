name: Auto-approve PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-approve pull request
        env:
          TOKEN: ${{ secrets.AUTO_APPROVE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BOT_LOGIN: "auto-approve-bot"
        run: |
          if [ -z "$TOKEN" ]; then
            echo "AUTO_APPROVE_TOKEN secret is not set. Exiting.";
            exit 0;
          fi

          echo "Posting approval for PR #$PR in $REPO"

          # Optional safety: do not approve PRs authored by the bot itself
          AUTHOR=$(jq -r .pull_request.user.login < $GITHUB_EVENT_PATH)
          if [ "$AUTHOR" = "$BOT_LOGIN" ]; then
            echo "PR author is bot ($AUTHOR). Skipping approval.";
            exit 0;
          fi

          curl -sS -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pulls/$PR/reviews \
            -d '{"body":"Auto-approving via workflow","event":"APPROVE"}'
